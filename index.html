*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 40px}

/* 头部 */

.nav-inner{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav-btn{border:1px solid var(--line);background:#fff;color:var(--sub);padding:4px 13px;border-radius:15px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500}
.nav-btn.active{color:#fff;border-color:transparent}

.cat-block{margin-top:18px}

.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-1{grid-template-columns:1fr}

.src-head{display:flex;align-items:center;gap:7px;padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.src-ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.src-name{font-size:13.5px;font-weight:700}

.src-link:hover{color:#2563eb;background:#e3e8f3}

.row:last-child{border-bottom:none}
.row:hover{background:#fafbfc}
.rk{flex:none;width:18px;height:18px;border-radius:5px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}

.rk-top{display:flex;align-items:flex-start;gap:6px}

.rk-title:hover{color:#2563eb;text-decoration:underline}
.rk-heat{flex:none;font-size:10.5px;color:var(--sub);white-space:nowrap;background:#eef1f7;border-radius:4px;padding:0 5px}

.hist-tag{flex:none;color:var(--sub)}
.hist-links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist-link{color:var(--sub);text-decoration:none;padding:2px 10px;border:1px solid var(--line);border-radius:12px;white-space:nowrap}

.to-top:hover{color:var(--ink)}

  let html = `<button class="nav-btn active" data-cat="">全部</button>`;
  catOrder.forEach(c => { html += `<button class="nav-btn" data-cat="${c}">${c}</button>`; });
  html += `<span class="nav-note">点分类筛选 · 点标题在新标签页打开原文</span>`;
  nav.innerHTML = html;
  nav.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      nav.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCat = btn.dataset.cat;
      renderApp();
    });
  });
}

function renderApp(){
  const app = document.getElementById("app");
  let html = "";
  DATA.filter(d => !activeCat || d.cat === activeCat).forEach(block => {
    const total = block.items.reduce((s,x)=>s+x.rows.length,0);
    html += `<section class="cat-block ${CAT_CLASS[block.cat]}">`;
    const nc = block.items.length === 4 ? 2 : Math.min(block.items.length, 3);
    html += `<div class="cat-head"><span class="cat-bar"></span><span class="cat-name">${block.cat}</span><span class="cat-count">${block.items.length} 源 · ${total} 条</span></div><div class="grid cols-${nc}">`;
    block.items.forEach(src => {
      html += `<div class="src-card"><div class="src-head"><span class="src-ico" style="background:${src.color}">${src.icon}</span><span class="src-name">${src.name}</span><a class="src-link" href="${src.src}" target="_blank" rel="noopener">来源 ↗</a></div>`;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      src.rows.forEach((r,i) => {
        html += `<div class="row"><span class="rk ${rankClass(i+1)}">${i+1}</span><div class="rk-body">`;
        html += `<div class="rk-top"><a class="rk-title" href="${r.u}" title="${esc(r.t)}" target="_blank" rel="noopener">${r.t}</a>${r.h?`<span class="rk-heat">${r.h}</span>`:""}</div></div></div>`;
      });
      html += `</div>`;
    });
    html += `</div></section>`;
  });
  app.innerHTML = html;
}

document.getElementById("fetch-time").textContent = FETCH_TIME;
renderNav();
renderApp();
document.getElementById("to-top").addEventListener("click", () => window.scrollTo({top:0,behavior:"smooth"}));
</script>
</body>
</html>
