name: Daily Hotlist Update

on:
  schedule:
    - cron: '0 2,14 * * *'  # 每日北京时间 10:00 / 22:00（UTC 02:00 / 14:00）
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hotlists
        run: python3 scripts/fetch.py

      - name: Build page
        run: python3 scripts/gen.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "NO_CHANGES" || {
            git commit -m "每日热榜更新 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')"
            git push
          }
